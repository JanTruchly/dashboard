<div class="header">
    <h2 id="greeting"></h2>

    <script>
        (function () {
            const student = 'Honza';
            const greetingEL = document.getElementById('greeting');

            function updateGreeting() {
                const hour = new Date().getHours();
                let msg = '';
                if (hour < 12) {
                    msg = 'Dobry rano';
                } else if (hour < 18) {
                    msg = 'Dobry odpoledne';
                } else if (hour < 22) {
                    msg = 'Dobry vecer';
                } else {
                    msg = 'Dobro noc';
                }
                greetingEL.textContent = msg + ',' + student + '!';

            }
            updateGreeting();

        })();
    </script>
</div>
